name: 03 - Deploy Employee Analytics PROD

on:
  push:
    branches: [main]
    paths:
      - "manifest.yml"
      - "sources/**"
      - "scripts/03_load_prod_sample_data.sql"
      - "scripts/04_validate_prod.sql"

permissions:
  id-token: write
  contents: read

env:
  SNOWFLAKE_USER: SVC_EMP_DCM_PROD
  SNOWFLAKE_ACCOUNT: ${{ vars.SNOWFLAKE_ACCOUNT }}
  SNOWFLAKE_CLI_FEATURES_ENABLE_DBT: true

jobs:
  deploy-prod:
    runs-on: ubuntu-latest
    environment: DCM_PROD

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Snowflake CLI with OIDC
        uses: snowflakedb/snowflake-actions@v3
        with:
          use-oidc: true

      - name: Test Snowflake connection
        run: |
          snow connection test \
            --account "$SNOWFLAKE_ACCOUNT" \
            --user "$SNOWFLAKE_USER" \
            -x

      - name: Run full PROD DCM PLAN
        run: |
          snow dcm plan \
            --target DCM_PROD \
            -x

      - name: Deploy DCM to PROD
        run: |
          snow dcm deploy \
            --target DCM_PROD \
            -x

      - name: Load PROD sample data
        run: |
          snow sql \
            -f scripts/03_load_prod_sample_data.sql \
            --database EMPLOYEE_ANALYTICS_PROD \
            --schema RAW \
            --role EMPLOYEE_ENGINEER \
            --warehouse EMPLOYEE_LOAD_WH_PROD \
            --account "$SNOWFLAKE_ACCOUNT" \
            --user "$SNOWFLAKE_USER" \
            -x

      - name: Prepare clean dbt project
        run: |
          mkdir -p ci_dbt_project

          cp sources/dbt/employee_analytics/dbt_project.yml ci_dbt_project/
          cp sources/dbt/employee_analytics/profiles.yml ci_dbt_project/

          cp -R sources/dbt/employee_analytics/models ci_dbt_project/

          if [ -d "sources/dbt/employee_analytics/macros" ]; then
            cp -R sources/dbt/employee_analytics/macros ci_dbt_project/
          fi

          if [ -d "sources/dbt/employee_analytics/tests" ]; then
            cp -R sources/dbt/employee_analytics/tests ci_dbt_project/
          fi

      - name: Deploy dbt project object to PROD
        run: |
          snow dbt deploy EMPLOYEE_ANALYTICS_DBT \
            --source ./ci_dbt_project \
            --default-target prod \
            --dbt-version 1.11.11 \
            --database EMPLOYEE_ANALYTICS_PROD \
            --schema DBT_PROJECTS \
            --role EMPLOYEE_DBT \
            --warehouse EMPLOYEE_TRANSFORM_WH_PROD \
            --account "$SNOWFLAKE_ACCOUNT" \
            --user "$SNOWFLAKE_USER" \
            -x

      - name: Build dbt models in PROD
        run: |
          snow dbt execute \
            -x \
            --account "$SNOWFLAKE_ACCOUNT" \
            --user "$SNOWFLAKE_USER" \
            --database EMPLOYEE_ANALYTICS_PROD \
            --schema DBT_PROJECTS \
            --role EMPLOYEE_DBT \
            --warehouse EMPLOYEE_TRANSFORM_WH_PROD \
            EMPLOYEE_ANALYTICS_PROD.DBT_PROJECTS.EMPLOYEE_ANALYTICS_DBT \
            build \
            --target prod

      - name: Validate PROD
        run: |
          snow sql \
            -f scripts/04_validate_prod.sql \
            --database EMPLOYEE_ANALYTICS_PROD \
            --schema ANALYTICS \
            --role EMPLOYEE_DBT \
            --warehouse EMPLOYEE_TRANSFORM_WH_PROD \
            --account "$SNOWFLAKE_ACCOUNT" \
            --user "$SNOWFLAKE_USER" \
            -x